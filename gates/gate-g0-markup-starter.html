<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay E-Kittens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>

    <header>
      <div class = "box columns">
        <h1 class="title has-text-cream">Barangay E-Kittens</h1> 
        <img src="../images/appleImage.jpg" alt="Barangay San Juan Logo (trust)" width = 50px >
      </div>
    </header>

    <nav>
      <div class = "box columns">
        <a href = "#about" class = "m-auto">About</a>
        <a href = "#officials" class = "m-auto">Officials</a>
        <a href = "#contact" class = "m-auto">Contact</a>
      </div>
    </nav>

    <main>

      <section id = "about">
        <h1 class="title">About</h1>
        <p>This is Barangay E-Kittens, where the E-Kittens reside. Meow meow. Yes.</p>
      </section>

      <section id = "officials" class = "columns">

        <article class = "is-one-third-desktop is-mobile">
          <h1>Meow</h1>
          <img src="../images/Xian.jpeg">
        </article>
        <article class = "is-one-third-desktop is-mobile">
          <h1>Meow</h1>
          <img src="../images/Brentt.jpeg">
        </article>
        <article class = "is-one-third-desktop is-mobile">
          <h1>Meow</h1>
          <img src="../images/Raiza.jpeg">
        </article>

      </section>

      <section id = "contact">

        <h1 class="title is-4">COntact Us!!</h1>

        <form action = "#" method = "post">

          <div class = "field">
            <label class ="label" for="name">Whats ur name yeah</label>
          </div>

          <div class="control">
            <input class = "input" type="text" id="name" placeholder="Full Name" required>
          </div>

          <div class = "field">
            <label class ="label" for="name">Can u put ur email</label>
          </div>

          <div class="control">
            <input class = "input" type="text" id="email" placeholder="Email" required>
          </div>

          <div class = "field">
            <div class = "control">
              <button class="button is-primary" type="submit">Yeah Submit Something</button>
            </div>
          </div>

        </form>

      </section>

    </main>

    <footer >
      <p class="footer">© 2026 Barangay E-Kittens</p>
    </footer>
